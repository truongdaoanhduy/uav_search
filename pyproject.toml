[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uav-search-paper-baselines"
version = "0.1.0"
description = "Minimal paper-faithful MARL baselines for heterogeneous UAV post-disaster search"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "torch>=2.2",
  "gymnasium>=0.29",
  "PyYAML>=6.0",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "wandb>=0.22.3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
