scenario:
  name: u6
  architecture: homogeneous_peer
  # Research adaptation: six identical multi-rotor UAVs, no leader/follower.
  fixed_wing: 0
  multirotor: 6
  num_uavs: 6
  # Full-3D research adaptation. MRMG publishes a 50--150 m UAV altitude
  # interval; Liu et al. publish low/mid/high sensing layers but not their
  # physical metre values. The 100 m midpoint and mapping are project design.
  altitude_min_m: 50.0
  altitude_max_m: 150.0
  altitude_bounds_provenance: "LITERATURE_BACKED_BASELINE:MRMG_2026"
  altitude_levels_m: [50.0, 100.0, 150.0]
  altitude_levels_provenance: RESEARCH_ADAPTATION
  # Hybrid option C: mission/mobility stay in PaperUAVEnv; UavNetSim owns peer MAC/PHY.
  network_backend: uavnetsim
  network_backend_provenance: RESEARCH_DESIGN
  uavnetsim_channel_mode: a2a
  uavnetsim_channel_mode_provenance: UAVNETSIM_EXPLICIT
  uavnetsim_bit_rate_bps: 2000000
  uavnetsim_bit_rate_provenance: UAVNETSIM_DEFAULT_80211B
  # RF transmit power is deliberately separate from the root paper's P_com=5 W
  # communication-energy term. UavNetSim upstream uses 0.1 W by default.
  uavnetsim_tx_power_w: 0.1
  uavnetsim_tx_power_provenance: UAVNETSIM_DEFAULT_RF_POWER
  uavnetsim_sinr_threshold_db: 6.0
  uavnetsim_sinr_threshold_provenance: UAVNETSIM_DEFAULT_80211B
  uavnetsim_los_model: free_space
  uavnetsim_nlos_model: urban
  # Reference contact range at reference RF power. Actual operational reach is
  # power-scaled and still subjected to UavNetSim MAC/PHY/SINR.
  peer_contact_range_m: 2000.0
  gcs_contact_range_m: 2000.0
  contact_range_provenance: RESEARCH_DESIGN_CALIBRATION_REQUIRED
  tx_power_min_w: 0.1
  tx_power_max_w: 0.4
  tx_power_reference_w: 0.1
  tx_power_provenance: BUFFER_AIDED_MULTI_UAV_RELAY_REFERENCE
  network_packet_payload_bytes: 32768
  network_packet_payload_provenance: RESEARCH_DESIGN_SIMULATION_GRANULARITY
  targets: 10
  targets_provenance: PAPER_INFERRED
  obstacles: 6
  obstacles_provenance: ASSUMED
  # Research mission duration: the paper-faithful scenarios remain at 50 steps.
  # 600 x 1 s lets a 10 m/s multirotor traverse 6 km, enough to search a 5 km map
  # and alter the network topology instead of being trapped near initialization.
  episode_steps: 600
  episode_steps_provenance: RESEARCH_DESIGN_JTFR_JUROR_INSPIRED
  # All UAVs deploy from the same emergency GCS site but occupy separate safe
  # launch pads so the initial state is not an artificial collision.
  initialization: gcs_launch_pads
  launch_radius_m: 300.0
  initial_min_separation_m: 150.0
  initialization_provenance: RESEARCH_DESIGN_COMMON_GCS_SITE
  # Fixed edge command vehicle: direct communication is useful near the staging
  # side, while exploration farther into the map naturally needs relays/SCF.
  gcs_position_m: [0.0, 2500.0, 0.0]
  gcs_position_provenance: ADAPTED_ASSUMPTION
  report_bytes: 1000000
  report_bytes_provenance: UAV_ASSISTED_VDTN_500KB_TO_1MB
  buffer_bytes: 10000000
  buffer_bytes_provenance: RESEARCH_DESIGN_LITERATURE_SENSITIVITY_BASELINE
  delivery_reward: 20.0
  delivery_reward_provenance: ADAPTED_ASSUMPTION
  report_ttl_s: 300.0
  report_ttl_provenance: UAV_ASSISTED_VDTN_EXPLICIT
  neighbor_cache_ttl_steps: 50
  neighbor_cache_provenance: RESEARCH_DESIGN_JUROR_INSPIRED
  # Long u6 horizons must not reuse the root paper's positive residual-battery
  # reward every step; use a small explicit per-Joule cost instead.
  energy_cost_per_j: 0.001
  energy_cost_provenance: RESEARCH_DESIGN
