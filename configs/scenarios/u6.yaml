scenario:
  name: u6
  architecture: homogeneous_peer
  # Research adaptation: six identical multi-rotor UAVs, no leader/follower.
  fixed_wing: 0
  multirotor: 6
  num_uavs: 6
  # Full-3D research adaptation. MRMG publishes a 50--150 m UAV altitude
  # interval; Liu et al. publish low/mid/high sensing layers but not their
  # physical metre values. The 100 m midpoint and mapping are project design.
  altitude_min_m: 50.0
  altitude_max_m: 150.0
  altitude_bounds_provenance: "LITERATURE_BACKED_BASELINE:DRONE_DELIVERY_MULTI_FLIGHT_LEVEL_2024"
  altitude_levels_m: [50.0, 100.0, 150.0]
  # The exact three flight levels 50/100/150 m are used in published multi-flight-level UAV work.
  # Mapping Liu et al.'s low/mid/high sensing profiles onto these physical levels remains an adaptation.
  altitude_levels_provenance: "LITERATURE_BACKED_BASELINE:DRONE_DELIVERY_MULTI_FLIGHT_LEVEL_2024"
  altitude_sensing_mapping_provenance: RESEARCH_ADAPTATION

  # Continuous altitude-aware target sensing. Hu et al. (Sensors 2014) give
  # the nadir-camera geometry r_FOV = h*tan(phi), with phi = half the full
  # camera FoV, but do not publish a numeric phi. We calibrate a fixed 90 deg
  # full FoV, then evaluate the circular footprint against absolute grid-cell
  # geometry at the UAV's true XY pose. The number of intersected cells therefore
  # varies near cell boundaries instead of being forced to 1/5/9. Pd/Pf are
  # linearly interpolated between Liu's explicit low/mid/high anchors.
  sensing_model: continuous_hu_liu
  sensing_model_provenance: "RESEARCH_ADAPTATION:HU_2014_GEOMETRIC_FOV_PLUS_LIU_2024_SENSOR_ANCHORS"
  camera_full_fov_deg: 90.0
  camera_full_fov_provenance: "RESEARCH_CALIBRATION:90_DEGREE_NADIR_FOV"
  sensing_grid_cell_m: 100.0
  sensing_grid_provenance: RESEARCH_ADAPTATION
  sensing_fov_cells: [1, 5, 9]
  sensing_fov_provenance: "CORE_PAPER_EXPLICIT:LIU_2024_3D_SEARCH"
  sensing_detection_probability: [0.90, 0.80, 0.70]
  sensing_false_alarm_probability: [0.10, 0.20, 0.30]
  sensing_probability_provenance: "CORE_PAPER_EXPLICIT:LIU_2024_3D_SEARCH"
  belief_prior: 0.5
  belief_prior_provenance: "CORE_PAPER_EXPLICIT:LIU_2024_3D_SEARCH"
  target_confirmation_threshold: 0.99
  target_confirmation_provenance: "CORE_PAPER_EXPLICIT:LIU_2024_3D_SEARCH"
  # Coarse/high-altitude sensing may identify a suspected cell, but final
  # identification requires a positive observation at the low/fine layer.
  fine_confirmation_max_altitude_m: 50.0
  fine_confirmation_provenance: "RESEARCH_ADAPTATION:LIU_2024_HIGH_LOW_CONFIRMATION"
  sensing_target_reward_weight: 1.0
  sensing_cognitive_reward_weight: 0.1
  sensing_reward_weight_provenance: "CORE_PAPER_EXPLICIT:LIU_2024_3D_SEARCH"
  # Hybrid option C: mission/mobility stay in PaperUAVEnv; UavNetSim owns peer MAC/PHY.
  network_backend: uavnetsim
  network_backend_provenance: RESEARCH_ADAPTATION
  uavnetsim_channel_mode: a2a
  uavnetsim_channel_mode_provenance: UAVNETSIM_NATIVE
  uavnetsim_bit_rate_bps: 2000000
  uavnetsim_bit_rate_provenance: UAVNETSIM_NATIVE
  # RF transmit power is deliberately separate from the root paper's P_com=5 W
  # communication-energy term. UavNetSim upstream uses 0.1 W by default.
  uavnetsim_tx_power_w: 0.1
  uavnetsim_tx_power_provenance: UAVNETSIM_NATIVE
  uavnetsim_sinr_threshold_db: 6.0
  uavnetsim_sinr_threshold_provenance: UAVNETSIM_NATIVE
  uavnetsim_los_model: free_space
  uavnetsim_nlos_model: urban
  # Ground links are not A2A: use the Al-Hourani probabilistic urban A2G model.
  # Urban parameters (a,b,eta_LoS,eta_NLoS) = (9.61,0.16,1 dB,20 dB).
  a2g_model: al_hourani_urban
  a2g_environment_a: 9.61
  a2g_environment_b: 0.16
  a2g_eta_los_db: 1.0
  a2g_eta_nlos_db: 20.0
  a2g_model_provenance: "LITERATURE_BACKED_BASELINE:AL_HOURANI_URBAN_A2G"
  # Fixed one-hop candidate radius. A 2026 heterogeneous maritime unmanned-system
  # study reports approximately 2 km WLAN range; UavNetSim still resolves PHY/MAC
  # success inside this geometric candidate radius. Cross-scenario calibration remains required.
  peer_contact_range_m: 2000.0
  gcs_contact_range_m: 2000.0
  contact_range_provenance: "LITERATURE_BACKED_BASELINE:ENERGY_INFORMATION_DECISION_2026_2KM_WLAN"
  contact_range_calibration_status: "RECALIBRATION_REQUIRED:POST_A2G_POWER_AWARE_HARDENING"
  tx_power_min_w: 0.1
  tx_power_max_w: 0.4
  tx_power_reference_w: 0.1
  tx_power_provenance: "LITERATURE_BACKED_BASELINE:CAO_2019_BUFFER_AIDED_MULTI_UAV_RELAY"
  # UavNetSim's installed default average data payload is 1024 bytes (8192 bits),
  # which is also a common explicit packet size in FANET simulation papers.
  network_packet_payload_bytes: 1024
  network_packet_payload_provenance: UAVNETSIM_NATIVE
  network_packet_payload_literature_support: "LITERATURE_BACKED_BASELINE:FANET_1024B"
  # Peer knowledge synchronization is an abstract 4 KiB application bundle.
  # It carries position/battery plus a quantized 50x50 belief map and target-knowledge
  # metadata; the exact serialization size is a project assumption, not paper-explicit.
  peer_sync_bytes: 4096
  peer_sync_bytes_provenance: RESEARCH_ASSUMPTION
  targets: 10
  targets_provenance: "LITERATURE_BACKED_BASELINE:AO_ROOT_10_TARGET_SCENARIOS"
  obstacles: 6
  # The root paper explicitly models post-disaster buildings as 2-D circles, but does
  # not publish six as the main simulation count. Six circles and their radii remain
  # a scenario-density assumption; u6 extrudes them vertically as no-fly columns.
  obstacles_provenance: RESEARCH_ASSUMPTION
  obstacle_shape_provenance: "RESEARCH_ADAPTATION:AO_ROOT_CIRCULAR_BUILDINGS_EXTRUDED_3D"
  # Buffer-aided multi-UAV relaying literature commonly discretizes flight into 1 s slots.
  dt_s: 1.0
  dt_provenance: "LITERATURE_BACKED_BASELINE:CAO_2022_BUFFER_AIDED_MULTI_UAV_RELAY_1S_SLOT"
  # Research mission duration: the paper-faithful scenarios remain at 50 steps.
  # 600 x 1 s lets a 10 m/s multirotor traverse 6 km, enough to search a 5 km map
  # and alter the network topology instead of being trapped near initialization.
  episode_steps: 600
  # A SAR FANET study uses 600 s explicitly; with dt=1 s this is the same horizon.
  # The value is literature-backed but still requires sensitivity analysis on this 5 km map.
  episode_steps_provenance: "LITERATURE_BACKED_BASELINE:SAR_OLSR_2023_600S"
  episode_steps_calibration_status: RESEARCH_DESIGN_CALIBRATION_REQUIRED
  # All UAVs deploy from the same emergency GCS site but occupy separate safe
  # launch pads so the initial state is not an artificial collision.
  initialization: gcs_launch_pads
  # Published search frameworks deploy all UAVs from a common base. Separate pads
  # avoid an artificial t=0 collision; 300 m is geometry chosen to fit six pads.
  launch_radius_m: 300.0
  launch_radius_provenance: RESEARCH_DESIGN_DERIVED_SAFE_PAD_GEOMETRY
  safety_distance_m: 141.4
  safety_distance_provenance: "LITERATURE_BACKED_BASELINE:LIU_2024_SAFE_DISTANCE_141_4M"
  initial_min_separation_m: 141.4
  initial_min_separation_provenance: "RESEARCH_ADAPTATION:LIU_2024_SAFE_DISTANCE_141_4M"
  initialization_provenance: "LITERATURE_BACKED_BASELINE:GLIDE_2024_COMMON_BASE"
  # Fixed edge command vehicle: direct communication is useful near the staging
  # side, while exploration farther into the map naturally needs relays/SCF.
  gcs_position_m: [0.0, 2500.0, 0.0]
  # SAR FANET literature explicitly places the ground base station at the edge of
  # the simulated search area. The exact midpoint-on-edge coordinate is adapted here.
  gcs_position_provenance: "RESEARCH_ADAPTATION:SAR_OLSR_2023_EDGE_BASE_STATION"
  report_bytes: 1000000
  report_bytes_provenance: "LITERATURE_BACKED_BASELINE:DU_2021_UAV_ASSISTED_VDTN_500KB_TO_1MB"
  # Workload-coupled finite storage: each UAV can carry three complete
  # reports, so buffer pressure is reachable with ten one-MB mission reports.
  buffer_bytes: 3000000
  buffer_bytes_provenance: "RESEARCH_DESIGN_WORKLOAD_COUPLED:3_COMPLETE_REPORTS"
  delivery_reward: 20.0
  delivery_reward_provenance: RESEARCH_DESIGN_CALIBRATION_REQUIRED
  expiry_penalty: 20.0
  expiry_penalty_provenance: "RESEARCH_DESIGN:SYMMETRIC_WITH_DELIVERY_REWARD"
  report_ttl_s: 300.0
  report_ttl_provenance: "LITERATURE_BACKED_BASELINE:DU_2021_UAV_ASSISTED_VDTN_300S_TTL"
  # DJI Mavic 3 Enterprise is a close small-multirotor hardware reference; published
  # smart-sensing work reports a 77 Wh battery, i.e. 277.2 kJ.
  battery_capacity_j: 277200.0
  battery_capacity_provenance: "LITERATURE_BACKED_BASELINE:MAVIC3_ENTERPRISE_77WH"
  battery_capacity_calibration_status: "CALIBRATED:50_SEEDS_X_600S_AGGRESSIVE_3D_NO_TX"
  # UavNetSim's native virtual-force neighbor table expires entries after 5 s.
  # With dt=1 s, five RL steps use the same freshness horizon.
  neighbor_cache_ttl_steps: 5
  neighbor_cache_provenance: "RESEARCH_ADAPTATION:UAVNETSIM_NATIVE_5S_NEIGHBOR_LIFETIME"
  # Long u6 horizons must not reuse the root paper's positive residual-battery
  # reward every step; use a small explicit per-Joule cost instead.
  energy_cost_per_j: 0.001
  energy_cost_provenance: RESEARCH_DESIGN_CALIBRATION_REQUIRED
  propulsion_model_provenance: "RESEARCH_ASSUMPTION:LEGACY_SIMPLIFIED_MODEL_UNPUBLISHED_COEFFICIENTS"
